<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InCaseYou</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gorditas:wght@400;700&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body data-page="landing">
    <div id="app">
        <section class="view active">
            <div class="page-wrapper">
                <div class="absolute-logo">incaseyou</div>

                <main class="content-main">
                    <div class="narrow-content">
                        <div class="landing-hero">
                            <svg class="landing-bow" viewBox="0 0 86 48" fill="none" aria-hidden="true">
                                <path d="M43 22C41 14 31 6 20 9C11 11.5 9 21 15 26C21 31 33 28 41 23" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M43 22C45 14 55 6 66 9C75 11.5 77 21 71 26C65 31 53 28 45 23" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M43 21C37 16 28 15 22 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                <path d="M43 21C49 16 58 15 64 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                <path d="M39.2 20.5C40.2 24.2 45.8 24.2 46.8 20.5C45.2 23.6 40.8 23.6 39.2 20.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                                <path d="M40 24.5C37 32 31 38 23 43" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                <path d="M46 24.5C49 32 55 38 63 43" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                            </svg>
                            <h1 class="main-heading">made for you</h1>
                            <span class="heading-rule" aria-hidden="true"></span>
                        </div>

                        <form id="creation-form" class="form-container">
                            <div class="input-row">
                                <div class="input-group">
                                    <label for="input-for">for:</label>
                                    <div class="input-shell">
                                        <svg class="input-glyph" viewBox="0 0 24 24" aria-hidden="true">
                                            <circle cx="12" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
                                            <path d="M5.6 19.2c1.15-3.15 3.35-4.7 6.4-4.7s5.25 1.55 6.4 4.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                        </svg>
                                        <input type="text" id="input-for" placeholder="their name" required autocomplete="off">
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label for="input-from">from:</label>
                                    <div class="input-shell">
                                        <svg class="input-glyph" viewBox="0 0 24 24" aria-hidden="true">
                                            <circle cx="12" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
                                            <path d="M5.6 19.2c1.15-3.15 3.35-4.7 6.4-4.7s5.25 1.55 6.4 4.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                        </svg>
                                        <input type="text" id="input-from" placeholder="your name" required autocomplete="off">
                                    </div>
                                </div>
                            </div>

                            <div class="input-group full-width">
                                <div class="label-row">
                                    <label for="input-note">a little note:</label>
                                    <span class="char-counter"><span id="note-counter">0</span>/65</span>
                                </div>
                                <div class="input-shell">
                                    <svg class="input-glyph" viewBox="0 0 24 24" aria-hidden="true">
                                        <rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
                                        <path d="M4.2 7.6 12 13.1 19.8 7.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <input type="text" id="input-note" placeholder="for whenever you need this" maxlength="65" required autocomplete="off">
                                </div>
                            </div>

                            <button type="submit" class="btn-primary mt-large">MAKE IT &rarr;</button>
                        </form>
                    </div>
                </main>
            </div>
        </section>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
